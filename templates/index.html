<!DOCTYPE html>
<html>
<head>
    <title>Car Price Predictor</title>
</head>
<body>

<style>
    body{
        background-color: black;
    }
    header{
        height: 50px;
        text-align:center;
        background-color: aqua;
    }
    main{
        margin: 5px 20px;
        text-align: center;
        font-size: 20px;
        background-color: rgb(231, 217, 228);
        padding: 20px;
    }
    .enter{
        font-size: 30px;
    }
    footer{
        margin-top: 20px;
        text-align: center;
    }
    .prediction{
        background-color: aquamarine;
        text-align: center;
        font-size: 25px;
        border-radius: 20px;
        margin-top: 20px;
        padding: 10px;
    }
</style>

<header>
    <h2>Predict Your Car Price</h2>
</header>

<main>
<form action="/predict" method="POST">

    <div class="enter">Enter Your Car Details</div>

    <label>Company:</label><br>
    <select name="company" id="company" onchange="updatecars()" required>
        <option value="" disabled selected>Select Company</option>
        {% for company in companies %}
            <option value="{{ company }}">{{ company }}</option>
        {% endfor %}
    </select><br><br>

    <label>Car Name:</label><br>
    <select name="name" id="car_name" required>
        <option value="" disabled selected>Select Car Name</option>
    </select><br><br>

    <label>Year:</label><br>
    <input type="number" name="year" required><br><br>

    <label>Kilometers Driven:</label><br>
    <input type="number" name="kms_driven" required><br><br>

    <label>Fuel Type:</label><br>
    <select name="fuel_type" required>
        <option value="" disabled selected>Select Fuel Type</option>
        <option value="Petrol">Petrol</option>
        <option value="Diesel">Diesel</option>
        <option value="CNG">CNG</option>
        <option value="LPG">LPG</option>
    </select><br><br>

    <button type="submit">Predict Price</button>

</form>
</main>

{% if prediction_text %}
<div class="prediction">
    <h3>{{ prediction_text }}</h3>
</div>
{% endif %}

<script>
const companycarData = {{ company_car | tojson | safe }};

function updatecars(){
    const company = document.getElementById("company").value;
    const carselect = document.getElementById("car_name");

    carselect.innerHTML = '<option value="" disabled selected>Select Car Name</option>';

    if(companycarData[company]){
        companycarData[company].forEach(function(car){
            let option = document.createElement("option");
            option.value = car;
            option.text = car;
            carselect.appendChild(option);
        });
    }
}
</script>

</body>
</html>
